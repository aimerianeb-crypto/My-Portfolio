<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cake Game Ultimate ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    font-family:Arial;
    overflow:hidden;
    color:white;
}

.container{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

/* buttons */
button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:scale(1.1);
}

#yesBtn{ background:#4CAF50; color:white; }
#noBtn{ background:#ff4d4d; color:white; }

#doneBtn, #chocoBtn, #yemaBtn{
    display:none;
    margin:10px;
}

/* timer */
#timer{
    font-size:60px;
    font-weight:bold;
}

/* hearts */
.heart{
    position:absolute;
    animation:float 5s linear infinite;
}

@keyframes float{
    0%{transform:translateY(100vh);}
    100%{transform:translateY(-10vh);}
}

</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="container">
    <h1>MOKAUN KAG CAKE? 🍰</h1>
    <div>
        <button id="yesBtn">YES</button>
        <button id="noBtn">NO</button>
    </div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="container" style="display:none;">
    <h1>🔥 CHALLENGE 🔥</h1>

    <div id="timer">10</div>

    <h2>SAY THIS WORD:</h2>
    <h1>❤️ I LOVE YOU ATE YAYA ❤️</h1>

    <button id="doneBtn">DONE</button>
</div>

<!-- PAGE 3 -->
<div id="page3" class="container" style="display:none;">
    <h1>🍰 CHOOSE YOUR CAKE 🍰</h1>

    <button id="chocoBtn">🍫 CHOCO MOIST</button>
    <button id="yemaBtn">🍮 YEMA CAKE</button>
</div>

<script>

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");
const page3 = document.getElementById("page3");

const timer = document.getElementById("timer");
const doneBtn = document.getElementById("doneBtn");

const chocoBtn = document.getElementById("chocoBtn");
const yemaBtn = document.getElementById("yemaBtn");

/* NO BUTTON RUN AWAY */
noBtn.addEventListener("mouseover", ()=>{
    noBtn.style.position="absolute";
    noBtn.style.left=Math.random()*80+"vw";
    noBtn.style.top=Math.random()*80+"vh";
});

/* YES CLICK */
yesBtn.addEventListener("click", ()=>{

    page1.style.display="none";
    page2.style.display="flex";

    let time = 10;
    timer.innerText = time;

    let countdown = setInterval(()=>{

        time--;
        timer.innerText = time;

        if(time <= 0){
            clearInterval(countdown);
            timer.innerText = "DONE NA 😆";
            doneBtn.style.display="block";
        }

    },1000);

});

/* DONE → PAGE 3 */
doneBtn.addEventListener("click", ()=>{

    page2.style.display="none";
    page3.style.display="flex";

    chocoBtn.style.display="block";
    yemaBtn.style.display="block";

});

/* CHOCO */
chocoBtn.addEventListener("click", ()=>{
    document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#ff758c,#ff7eb3);font-family:Arial;color:white;text-align:center;">
        <div>
            <h3>PAGPALIT HAHAHAHAHAHAHAHA 😂</h3>
        </div>
    </div>
    `;
});

/* YEMA */
yemaBtn.addEventListener("click", ()=>{
    document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#ff758c,#ff7eb3);font-family:Arial;color:white;text-align:center;">
        <div>
            <h3>PAGPALIT HAHAHAHAHAHAHAHA 😂</h3>
        </div>
    </div>
    `;
});

/* FLOATING HEARTS */
setInterval(()=>{
    let heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";

    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),5000);
},300);

</script>

</body>
</html>
