<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Invitation ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#ff758c,#ff7eb3);
    overflow:hidden;
}

/* floating hearts */
.heart{
    position:absolute;
    color:white;
    font-size:20px;
    animation: floatUp 6s linear infinite;
    opacity:0.6;
}

@keyframes floatUp{
    0%{transform: translateY(100vh) scale(0);}
    100%{transform: translateY(-10vh) scale(1.5);}
}

.container{
    text-align:center;
    color:white;
    z-index:2;
}

h1{
    font-size:38px;
    text-shadow:2px 2px 10px rgba(0,0,0,0.3);
    animation: fade 0.8s ease;
}

@keyframes fade{
    from{opacity:0; transform:scale(0.8);}
    to{opacity:1; transform:scale(1);}
}

button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    margin:10px;
    transition:0.2s;
}

button:hover{
    transform:scale(1.1);
}

#yesBtn{
    background:#4CAF50;
    color:white;
}

#noBtn{
    background:#ff4d4d;
    color:white;
    position:fixed;
}

/* confetti */
.confetti{
    position:absolute;
    width:10px;
    height:10px;
    top:-10px;
    animation: fall 3s linear infinite;
}

@keyframes fall{
    to{transform: translateY(100vh) rotate(360deg);}
}

</style>
</head>

<body>

<div class="container">
    <h1 id="question">LOVE KO NIMO? ❤️</h1>

    <div class="buttons">
        <button id="yesBtn">YES</button>
        <button id="noBtn">NO</button>
    </div>
</div>

<script>

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const question = document.getElementById("question");

/* 💖 QUESTIONS FIXED ORDER */
let questions = [
"LOVE KO NIMO? ❤️",
"ITREAT KO NIMO? 🥺",
"WINGS HAUZ DATE TA? 🍗❤️",
"IMO JUD KO TREAT HA? 🍕",
"I LOVE YOUUUU ❤️"
];

let index = 0;

/* 💖 floating hearts */
function createHearts(){
    let heart = document.createElement("div");
    heart.innerHTML = "❤️";
    heart.classList.add("heart");
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 10 + "px";
    document.body.appendChild(heart);

    setTimeout(()=> heart.remove(), 6000);
}
setInterval(createHearts, 300);

/* 💀 NO BUTTON MOVEMENT FIXED */
noBtn.style.position = "fixed";
noBtn.style.left = "50%";
noBtn.style.top = "55%";

function moveNo(){
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 100);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("click", moveNo);

/* ❤️ YES BUTTON LOGIC */
yesBtn.addEventListener("click",()=>{

    index++;

    if(index < questions.length){
        question.innerHTML = questions[index];
    } else {

        document.body.innerHTML = `
        <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:pink;font-family:Arial;text-align:center;">
            <div>
                <h1>YAY!! ❤️🥰</h1>
                <h2>See you tonight! 💖</h2>
                <p>I LOVE YOU ❤️</p>
            </div>
        </div>
        `;

        /* 🎉 CONFETTI EFFECT */
        for(let i=0;i<60;i++){
            let conf = document.createElement("div");
            conf.classList.add("confetti");
            conf.style.left = Math.random()*100 + "vw";
            conf.style.background = ["#fff","#ff0","#f0f","#0ff"][Math.floor(Math.random()*4)];
            conf.style.animationDuration = (Math.random()*3+2) + "s";
            document.body.appendChild(conf);
        }
    }

});

</script>

</body>
</html>
